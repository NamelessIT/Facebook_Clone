version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: fb_postgres
    restart: always
    environment:
      POSTGRES_DB: facebook_clone
      POSTGRES_USER: fb_admin
      POSTGRES_PASSWORD: fb_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
