name: CI

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running CI manually?"
        required: false
        default: "manual check"

jobs:
  contracts:
    name: Shared contracts drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated code is up to date
        run: python scripts/generate_shared_contracts.py --check

  backend:
    name: Backend build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore backend/FacebookClone.sln
      - name: Build
        run: dotnet build backend/FacebookClone.sln -c Release --no-restore
      - name: Test
        run: dotnet test backend/FacebookClone.sln -c Release --no-build --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    name: Frontend lint + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/Facebook_Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/Facebook_Frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
